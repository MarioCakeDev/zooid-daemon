services:
  zooid:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "9099"
    # Coolify injects the resource's environment variables into .env in this
    # compose directory. Loading it here passes them to the daemon without
    # committing any secrets to the repository.
    env_file:
      - .env
    volumes:
      # Docker socket for managing agent containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Workforce config + agent workdirs. The host source and the container
      # target MUST be the identical absolute path: the daemon computes per-agent
      # context sockets under <cwd>/data/run/context-*.sock and passes those
      # paths to the HOST docker daemon when spawning sibling agent containers,
      # so the same path must resolve on the host. On Home Worker 01,
      # /opt/matrix/zooid/workforce is a symlink to this resource's workforce dir.
      - /opt/matrix/zooid/workforce:/opt/matrix/zooid/workforce
    # Traefik routing for the appservice endpoint. Declared here (rather than
    # in Coolify's per-service domain field) so it travels with the repo.
    # priority=1000 beats the legacy hand-written dynamic router that shares
    # this Host rule and points at a stale IP.
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.zooidas.entrypoints=http
      - traefik.http.routers.zooidas.rule=Host(`zooid.coolify.lan`)
      - traefik.http.routers.zooidas.priority=1000
      - traefik.http.routers.zooidas.service=zooidas
      - traefik.http.services.zooidas.loadbalancer.server.port=9099
      # Public, path-specific ingress for inbound provider webhooks (GitHub
      # pull_request for the reviewer). Only the /_zooid/webhooks prefix is
      # forwarded; every other path on zooid.mariocake.de keeps hitting the
      # zooid-web client. HMAC verification happens in the daemon, using the
      # per-trigger `secret` (GITHUB_WEBHOOK_SECRET). Declared here so it
      # survives redeploys and Traefik resolves the container IP itself.
      - traefik.http.routers.zooidwh.entrypoints=https
      - traefik.http.routers.zooidwh.rule=Host(`zooid.mariocake.de`) && PathPrefix(`/_zooid/webhooks`)
      - traefik.http.routers.zooidwh.priority=1000
      - traefik.http.routers.zooidwh.service=zooidwh
      - traefik.http.routers.zooidwh.tls=true
      - traefik.http.routers.zooidwh.tls.certresolver=letsencrypt
      - traefik.http.services.zooidwh.loadbalancer.server.port=9099
    # Attach to the Coolify proxy network so Traefik can discover and route to
    # this container. The alias gives Traefik (and the dynamic file router) a
    # stable DNS name that survives container recreation.
    networks:
      coolify:
        aliases:
          - zooid-daemon

networks:
  coolify:
    external: true
